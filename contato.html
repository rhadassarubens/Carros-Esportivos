<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato • Rubens X Cars</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header class="menu">

        <h1>Rubens X Cars</h1>
        <p>Velocidade • Luxo • Potência</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="ferrari.html">Ferrari</a>
            <a href="porsche.html">Porsche</a>
            <a href="lamborghini.html">Lamborghini</a>
            <a href="bugatti.html">Bugatti</a>
            <a href="sobre.html">Sobre</a>
        </nav>

    </header>

    <main>

        <section class="contato">

            <h1>Contato</h1>

            <p>
                Tem alguma sugestão de supercarro para aparecer no
                Rubens X Cars? Envie sua mensagem pelo formulário abaixo.
            </p>

            <form id="formContato">

                <label for="nome">Nome</label>
                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >

                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="mensagem">Mensagem</label>
                <textarea
                    id="mensagem"
                    name="mensagem"
                    rows="6"
                    placeholder="Escreva sua mensagem"
                    required
                ></textarea>

                <button type="submit">Enviar mensagem</button>

            </form>

        </section>

        <a href="index.html" class="voltar">
            ⬅ Voltar para Home
        </a>

    </main>

    <footer class="footer">
        <p>Rubens X Cars • Página de Contato</p>
    </footer>

</body>

</html>
